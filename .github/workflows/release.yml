name: Build And Release Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Plugin Version
        id: plugin_version
        run: |
          VERSION=$(grep -E "^\s*\*\s*Version:" store-locator.php | head -n 1 | sed -E 's/.*Version:\s*([^[:space:]]+).*/\1/')
          if [ -z "$VERSION" ]; then
            echo "Could not read plugin version from store-locator.php"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check If Tag Exists
        id: tag_check
        run: |
          TAG="${{ steps.plugin_version.outputs.tag }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip When Release Already Exists
        if: steps.tag_check.outputs.exists == 'true'
        run: |
          echo "Release tag ${{ steps.plugin_version.outputs.tag }} already exists. Bump plugin version to create a new release."

      - name: Create Tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.plugin_version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Build Plugin Zip
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.plugin_version.outputs.version }}"
          mkdir -p dist/store-locator
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            --exclude '*.log' \
            ./ dist/store-locator/
          cd dist
          zip -r "store-locator-${VERSION}.zip" store-locator

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.plugin_version.outputs.tag }}"
          VERSION="${{ steps.plugin_version.outputs.version }}"
          gh release create "$TAG" "dist/store-locator-${VERSION}.zip" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "Automated release for Store Locator ${VERSION}"
